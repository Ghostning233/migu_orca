[project]
name = "migu_orca"
version = "0.1.0"
description = "MiKan and Bangumi RSS orchestration for Auto Bangumi"
readme = "README.md"
requires-python = "==3.13.12"
dependencies = [
    "flask>=3.1,<4",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
migu-orca = "apps.migu_orca_entry.controllers.entry_controller:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/apps",
    "src/extensions",
    "src/catalog_engine",
    "src/mikan_engine",
    "src/rss_engine",
    "src/subscription_engine",
    "src/ab_engine",
    "src/storage_engine",
    "src/request_engine",
    "src/shared",
]
