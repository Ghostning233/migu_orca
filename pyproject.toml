[project]
name = "migu_orca"
version = "0.1.0"
description = "MiKan and Bangumi RSS orchestration for Auto Bangumi"
readme = "README.md"
requires-python = "==3.13.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
migu-orca = "apps.migu_orca_entry.controllers.entry_controller:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/apps",
]
