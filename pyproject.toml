[project]
name = "migu_orca"
version = "0.1.0"
description = "MiKan and Bangumi RSS orchestration for Auto Bangumi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
migu-orca = "apps.migu_orca_entry.controllers.entry_controller:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/apps",
    "src/request_engine",
    "src/bangumi_match_engine",
    "src/mikan_engine",
    "src/rss_engine",
    "src/subtitle_group_engine",
    "src/torrent_filter_engine",
    "src/folder_naming_engine",
    "src/user_config_engine",
    "src/request_confirm_engine",
    "src/auto_bangumi_engine",
    "src/storage_engine",
    "src/log_engine",
    "src/system_config_engine",
]
