[project]
name = "migu_orca"
version = "0.1.0"
description = "MiKan and Bangumi RSS orchestration for Auto Bangumi"
readme = "README.md"
requires-python = "==3.13.12"
dependencies = [
    "flask>=3.1,<4",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pillow>=11,<13",
    "pytest>=9.0.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.16,<1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# US-195 static check: ruff catches real issues (undefined names, unused
# imports, bugbear pitfalls, pyupgrade modernizations) with low churn.
# Deliberately *not* enabled:
# - E402: this codebase puts the module docstring after `from __future__`
#   (a project-wide style; moving it would churn every module).
# - E501: line length is intentionally not enforced (long Chinese UI strings
#   and fixture lines).
# - B009: `getattr(obj, "attr", default)` is used deliberately for duck-typed
#   responses (urllib internals, Playwright routes).
# - UP046/UP047: PEP 695 generics are a stylistic upgrade, not a correctness fix.
# - UP031: the two `%`-format call sites in browser tests are fixture seeds.
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "SIM"]
ignore = ["E402", "E501", "B009", "UP046", "UP047", "UP031"]

[project.scripts]
migu-orca = "apps.migu_orca_entry.controllers.entry_controller:main"
migu-orca-openapi = "apps.migu_orca_web.openapi_gen:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src", "tests"]
markers = [
    "browser: browser automation tests that require a browser binary",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/apps",
    "src/extensions",
    "src/batch_engine",
    "src/catalog_engine",
    "src/mikan_engine",
    "src/rss_engine",
    "src/subscription_engine",
    "src/ab_engine",
    "src/storage_engine",
    "src/request_engine",
    "src/tracking_engine",
    "src/shared",
]
