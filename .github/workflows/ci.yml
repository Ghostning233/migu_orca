name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks & non-browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up Node.js (for `node --check`)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Syntax check (compileall)
        run: uv run python -m compileall -q src tests

      - name: Static check (ruff)
        run: uv run ruff check src tests

      - name: Non-browser tests
        run: uv run pytest -q -m "not browser"

      - name: JS syntax check
        run: node --check src/apps/migu_orca_web/static/app.js

      - name: OpenAPI drift check
        run: uv run migu-orca-openapi --check

      - name: Whitespace / conflict markers
        run: git diff --check

  browser:
    name: Real Chromium browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install Playwright Chromium + system libraries
        run: |
          uv run playwright install --with-deps chromium

      - name: Run browser suite (fail loudly if Chromium cannot start)
        run: uv run pytest tests/browser/ -q
        env:
          MIGU_ORCA_CI: "1"
